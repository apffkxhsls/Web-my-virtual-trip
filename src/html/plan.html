<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="김지호">
    <meta name="description" content="My Virtual Trip 여행 계획 작성 페이지">
    <title>여행 계획 | My Virtual Trip</title>

    <!-- 공통 CSS -->
    <!-- <link rel="stylesheet" href="../css/common.css"> -->

    <link href="https://fonts.googleapis.com/css2?family=Asta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/plan.css">
</head>

<body>
    <!-- 공통 헤더 -->

    <main>
        <div class="plan-layout">

            <!-- 작성한 계획 목록 -->
            <aside class="plan-sidebar">
                <section class="saved-section">
                    <h2>작성한 계획 목록 보기</h2>

                    <div class="saved-list">
                        <article class="saved-card">
                            <img src="../res/images/shanghai.jpg" alt="상하이의 야경">

                            <div class="saved-info">
                                <h3>상하이 여행</h3>
                                <p>📅 2026.12.22 ~ 2026.12.25</p>
                                <p>📍 중국 상하이</p>
                            </div>
                        </article>
                    </div>
                </section>
            </aside>

            <!-- 여행 계획 작성 -->
            <div class="plan-content">
                <section class="plan-section">
                    <h1>여행 계획 작성하기</h1>
                    <p class="section-description">
                        나만의 여행을 계획해보세요
                    </p>

                    <form class="plan-form">
                        <h2>기본 정보</h2>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="trip-title">여행 제목</label>
                                <input type="text" id="trip-title" name="trip-title" placeholder="예: 인생 첫 혼자 여행">
                            </div>

                            <div class="form-group">
                                <label for="trip-region">여행 지역</label>
                                <input type="text" id="trip-region" name="trip-region" placeholder="예: 일본 오사카">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="start-date">출발일</label>
                                <input type="date" id="start-date" name="start-date">
                            </div>

                            <div class="form-group">
                                <label for="end-date">도착일</label>
                                <input type="date" id="end-date" name="end-date">
                            </div>

                            <div class="form-group">
                                <label for="travelers">동행 인원</label>
                                <input type="number" id="travelers" name="travelers" min="1" placeholder="1">
                            </div>
                        </div>

                        <fieldset class="theme-fieldset">
                            <legend>여행 테마 선택</legend>

                            <div class="theme-options">
                                <div class="theme-option">
                                    <input type="checkbox" name="trip-theme" id="nature" value="nature">
                                    <label for="nature">🌿 자연</label>
                                </div>

                                <div class="theme-option">
                                    <input type="checkbox" name="trip-theme" id="history" value="history">
                                    <label for="history">🏛️ 역사</label>
                                </div>

                                <div class="theme-option">
                                    <input type="checkbox" name="trip-theme" id="food" value="food">
                                    <label for="food">🍜 먹방</label>
                                </div>

                                <div class="theme-option">
                                    <input type="checkbox" name="trip-theme" id="sea" value="sea">
                                    <label for="sea">🏖️ 바다</label>
                                </div>

                                <div class="theme-option">
                                    <input type="checkbox" name="trip-theme" id="activity" value="activity">
                                    <label for="activity">🚴 액티비티</label>
                                </div>

                                <div class="theme-option">
                                    <input type="checkbox" name="trip-theme" id="trendy" value="trendy">
                                    <label for="trendy">✨ 요즘</label>
                                </div>

                                <div class="theme-option">
                                    <input type="checkbox" name="trip-theme" id="friends" value="friends">
                                    <label for="friends">👫 친구</label>
                                </div>

                                <div class="theme-option">
                                    <input type="checkbox" name="trip-theme" id="solo" value="solo">
                                    <label for="solo">🎒 혼여행</label>
                                </div>
                            </div>
                        </fieldset>

                        <section class="schedule-section">
                            <h2>날짜별 여행 일정</h2>

                            <div class="day-section">
                                <h3>DAY 1</h3>

                                <table class="schedule-table">
                                    <thead>
                                        <tr>
                                            <th>시간</th>
                                            <th>방문 장소</th>
                                            <th>일정 내용</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td><input type="time"></td>
                                            <td><input type="text" placeholder="방문 장소"></td>
                                            <td><input type="text" placeholder="일정 입력"></td>
                                        </tr>
                                        <tr>
                                            <td><input type="time"></td>
                                            <td><input type="text" placeholder="방문 장소"></td>
                                            <td><input type="text" placeholder="일정 입력"></td>
                                        </tr>
                                    </tbody>
                                </table>

                                <button type="button" class="add-schedule-button">
                                    <img src="../res/icons/ic_add.svg" alt=""> 일정 추가하기
                                </button>
                            </div>

                            <div class="day-section">
                                <h3>DAY 2</h3>

                                <table class="schedule-table">
                                    <thead>
                                        <tr>
                                            <th>시간</th>
                                            <th>방문 장소</th>
                                            <th>일정 내용</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td><input type="time"></td>
                                            <td><input type="text" placeholder="방문 장소"></td>
                                            <td><input type="text" placeholder="일정 입력"></td>
                                        </tr>
                                        <tr>
                                            <td><input type="time"></td>
                                            <td><input type="text" placeholder="방문 장소"></td>
                                            <td><input type="text" placeholder="일정 입력"></td>
                                        </tr>
                                    </tbody>
                                </table>

                                <button type="button" class="add-schedule-button">
                                    <img src="../res/icons/ic_add.svg" alt=""> 일정 추가하기
                                </button>
                            </div>

                            <div class="day-section">
                                <h3>DAY 3</h3>

                                <table class="schedule-table">
                                    <thead>
                                        <tr>
                                            <th>시간</th>
                                            <th>방문 장소</th>
                                            <th>일정 내용</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td><input type="time"></td>
                                            <td><input type="text" placeholder="방문 장소"></td>
                                            <td><input type="text" placeholder="일정 입력"></td>
                                        </tr>
                                        <tr>
                                            <td><input type="time"></td>
                                            <td><input type="text" placeholder="방문 장소"></td>
                                            <td><input type="text" placeholder="일정 입력"></td>
                                        </tr>
                                    </tbody>
                                </table>

                                <button type="button" class="add-schedule-button">
                                    <img src="../res/icons/ic_add.svg" alt=""> 일정 추가하기
                                </button>
                            </div>
                        </section>

                        <section class="expense-section">
                            <h2>예상 지출</h2>

                            <div class="expense-list">
                                <div class="expense-item">
                                    <label for="transport">🚆 교통비</label>
                                    <div class="expense-input">
                                        <input type="number" id="transport" min="0" step="1000" placeholder="0">
                                        <span>원</span>
                                    </div>
                                </div>

                                <div class="expense-item">
                                    <label for="food-cost">🍽️ 식비</label>
                                    <div class="expense-input">
                                        <input type="number" id="food-cost" min="0" step="1000" placeholder="0">
                                        <span>원</span>
                                    </div>
                                </div>

                                <div class="expense-item">
                                    <label for="stay-cost">🏨 숙박비</label>
                                    <div class="expense-input">
                                        <input type="number" id="stay-cost" min="0" step="1000" placeholder="0">
                                        <span>원</span>
                                    </div>
                                </div>

                                <div class="expense-item">
                                    <label for="other-cost">🧳 기타</label>
                                    <div class="expense-input">
                                        <input type="number" id="other-cost" min="0" step="1000" placeholder="0">
                                        <span>원</span>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <div class="save-area">
                            <button type="button" class="save-button">
                                계획 저장
                            </button>
                        </div>

                    </form>
                </section>
            </div>

        </div>
    </main>

    <!-- 공통 푸터 -->
</body>

</html>
