<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="김예지">
    <meta name="description" content="My Virtual Trip 항공 페이지">
    <title>항공 | My Virtual Trip</title>
    <link rel="stylesheet" href="../css/flight.css">
</head>

<body>
    <!-- 공통 헤더 추후 추가 -->

    <main>
        <section class="flight-intro">
            <h1>새로운 여행의 시작, 항공편 찾기</h1>
            <p>일정에 맞는 항공편을 한눈에 비교해보세요.</p>
        </section>

        <form class="flight-search">
            <div class="trip-type">
                <label>
                    <input type="radio" name="trip-type" value="round-trip" checked>
                    왕복
                </label>

                <label>
                    <input type="radio" name="trip-type" value="one-way">
                    편도
                </label>

                <div class="search-field">
                    <label for="arrival">도착지</label>
                    <input type="text" id="arrival" name="arrival" placeholder="도시 또는 공항">
                </div>

                <div class="search-field">
                    <label for="departure-date">출발일</label>
                    <input type="date" id="departure-date" name="departure-date">
                </div>

                <div class="search-field">
                    <label for="return-date">귀국일</label>
                    <input type="date" id="return-date" name="return-date">
                </div>

                <div class="search-field">
                    <label for="passengers">인원</label>
                    <select id="passengers" name="passengers">
                        <option value="1">1명</option>
                        <option value="2">2명</option>
                        <option value="3">3명</option>
                        <option value="4">4명</option>
                        <option value="5">5명 이상</option>
                    </select>
                </div>

                <button type="button" class="search-button">검색</button>
            </div>
        </form>

        <div class="flight-layout">
            <aside class="flight-filter">
                <h2>필터</h2>

                <fieldset>
                    <legend>경유 여부</legend>

                    <label>
                        <input type="checkbox" name="stops" value="direct">
                        직항
                    </label>

                    <label>
                        <input type="checkbox" name="stops" value="connecting">
                        경유
                    </label>
                </fieldset>

                <fieldset>
                    <legend>항공사</legend>

                    <label>
                        <input type="checkbox" name="airline" value="korean-air">
                        대한항공
                    </label>

                    <label>
                        <input type="checkbox" name="airline" value="asiana-air">
                        아시아나항공
                    </label>

                    <label>
                        <input type="checkbox" name="airline" value="emirates">
                        에미레이트항공
                    </label>
                </fieldset>
            </aside>

            <!-- 항공편 목록 추후 추가 -->
        </div>

        <!-- 이용 시 주의사항 -->
    </main>

    <!-- 공통 푸터 추후 추가 -->

</body>

</html>
